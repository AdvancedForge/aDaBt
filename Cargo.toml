[workspace]
resolver = "2"
members = [
    "crates/adabt-core",
    "crates/adabt-ir",
    "crates/adabt-telemetry",
    "crates/adabt-storage",
    "crates/adabt-index",
    "crates/adabt-exec",
    "crates/adabt-opt",
    "crates/adabt-engine",
    "crates/adabt-testkit",
    "crates/adabt-bench",
    "crates/adabt-server",
    "crates/adabt-cli",
    "crates/adabt-ffi",
]
exclude = [
    "comparison",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
adabt-core = { path = "crates/adabt-core" }
adabt-ir = { path = "crates/adabt-ir" }
adabt-telemetry = { path = "crates/adabt-telemetry" }
adabt-storage = { path = "crates/adabt-storage" }
adabt-index = { path = "crates/adabt-index" }
adabt-exec = { path = "crates/adabt-exec" }
adabt-opt = { path = "crates/adabt-opt" }
adabt-engine = { path = "crates/adabt-engine" }
adabt-testkit = { path = "crates/adabt-testkit" }
thiserror = "1"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

# Benchmarks must never run against a debug build. This profile gives optimised
# code with tolerable compile times for iterating on the harness itself.
[profile.bench-fast]
inherits = "release"
lto = false
codegen-units = 16
