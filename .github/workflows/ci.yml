name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The feature gate must work in both directions, not merely compile.
      # `probe!` expands into caller crates, so a `cfg` mistake here silently
      # disables telemetry everywhere while still building cleanly.
      - run: cargo test -p adabt-telemetry --no-default-features
      - run: cargo test -p adabt-telemetry --features full
