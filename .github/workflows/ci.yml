name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The feature gate must work in both directions, not merely compile.
      # `probe!` expands into caller crates, so a `cfg` mistake here silently
      # disables telemetry everywhere while still building cleanly.
      - run: cargo test -p adabt-telemetry --no-default-features
      - run: cargo test -p adabt-telemetry --features full

  # The soak is the only test that can see interaction bugs. Every one of the
  # four defects found in M15 was a collision between components that each passed
  # their own tests — an experiment ramp that demanded evidence in inverse
  # proportion to how cheaply it could be gathered, a p99 judged from thirty
  # samples, a retraction reaper eating candidates mid-trial, and cumulative
  # counters that could never notice a workload had ended.
  #
  # It runs the adaptive engine against a workload that changes underneath it,
  # with a second database pinned at level 0 taking the same queries, and exits
  # non-zero on any divergence. Separate job because it is slow and its failure
  # means something different from a unit test's.
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile bench-fast -p adabt-bench
      # Short form: enough phases and traffic to exercise the whole loop —
      # build, shadow, ramp, promote, retract — without a twenty-minute job.
      - name: soak
        run: |
          target/bench-fast/adabt-bench soak \
            --data-dir "${RUNNER_TEMP}/soak" \
            --size 3000 --ops-per-phase 6000 --log

  witness:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adabt_witness
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install RocksDB deps
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: run SQLite witness (bundled, always)
        run: cargo run -p adabt-comparison --release -- --report docs/comparison-notes.md
      - name: run Postgres witness (service)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/adabt_witness
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          # Harness detects DATABASE_URL and runs same 8 workloads against Postgres;
          # if server unavailable it reports "witness unavailable" rather than failing CI.
          cargo run -p adabt-comparison --release -- --witness postgres || echo "Postgres witness unavailable on this runner"
      - name: run RocksDB witness (local)
        run: |
          # RocksDB via rust-rocksdb with cmake/libclang now available; harness feature-gates it.
          cargo run -p adabt-comparison --release --features rocksdb -- --witness rocksdb || echo "RocksDB harness not yet feature-gated"
